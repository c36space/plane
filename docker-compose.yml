services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - infra-net
    ports:
      - "3000:3000"
    volumes:
      - web-dist:/dist:ro
    depends_on:
      - api

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - infra-net
    ports:
      - "3001:3001"
    volumes:
      - admin-dist:/dist:ro
    depends_on:
      - api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - infra-net
    ports:
      - "3002:3002"
    depends_on:
      - api
      - web

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - infra-net
    ports:
      - "8000:8000"
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    environment:
      # Override these with your external database and Redis URLs
      # DATABASE_URL: postgresql://user:password@external-db-host:5432/plane
      # REDIS_URL: redis://external-redis-host:6379/
      DOCKERIZED: 1

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - infra-net
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - infra-net
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - infra-net
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - infra-net
    env_file:
      - ./apps/live/.env

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    networks:
      - infra-net
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    networks:
      - infra-net
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  # proxy:
  #   container_name: proxy
  #   build:
  #     context: ./apps/proxy
  #     dockerfile: Dockerfile.ce
  #   restart: always
  #   ports:
  #     - ${LISTEN_HTTP_PORT}:80
  #     - ${LISTEN_HTTPS_PORT}:443
  #   environment:
  #     FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  #     BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  #   depends_on:
  #     - web
  #     - api
  #     - space
  #     - admin

volumes:
  uploads:
  rabbitmq_data:
  web-dist:
  admin-dist:

networks:
  infra-net:
    external: true
    driver: bridge